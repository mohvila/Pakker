name: Prissammenligning

on:
  schedule:
    # Hver fredag kl. 05:17 UTC (07:17 dansk sommertid / 06:17 vintertid)
    - cron: "17 5 * * 5"
  workflow_dispatch:
    inputs:
      max_products:
        description: "Kun de første N produkter (tom = alle)"
        required: false

permissions:
  contents: write

concurrency:
  group: prissammenligning

jobs:
  sammenlign:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Kør prissammenligning
        env:
          SHOP_URL: https://luxury-outdoor.dk
          FIRST_SUPPLIERS: Lechuza
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          # Valgfrit: sæt SMTP-secrets, hvis rapporten også skal sendes på mail
          MAIL_TO: info@luxury-outdoor.dk
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAX_PRODUCTS: ${{ inputs.max_products }}
        run: python prissammenligning/prissammenligning.py
      - name: Gem rapporten i repoet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add prissammenligning/rapporter
          git diff --cached --quiet && exit 0
          git commit -m "Prissammenligning $(date +%d-%m-%Y)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
